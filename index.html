<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nabir</title>
<meta name="description" content="Save a word as fast as in Notes — and it’s already ready to learn. Nabir for iPhone.">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #f5f5f7;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #f2541b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --text: #f5f5f7;
      --muted: #a1a1a6;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 20px;
  }
  main img { width: 128px; height: 128px; margin-bottom: 20px; }
  h1 { font-size: 44px; line-height: 1.1; letter-spacing: -0.03em; margin: 0 0 12px; }
  .tagline { font-size: 22px; line-height: 1.35; max-width: 460px; margin: 0 0 16px; }
  .soon { color: var(--muted); margin: 0; }
  footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 20px;
    padding: 24px 20px 32px;
    color: var(--muted);
    font-size: 15px;
  }
  footer a { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <picture>
    <source srcset="/icon-night.png" media="(prefers-color-scheme: dark)">
    <img src="/icon.png" alt="Nabir app icon">
  </picture>
  <h1>Nabir</h1>
  <p class="tagline">Save a word as fast as in Notes — and it’s already ready to learn.</p>
  <p class="soon">Coming soon to iPhone.</p>
</main>
<footer>
  <span>Questions or feedback: <a href="mailto:hello@nabir.app">hello@nabir.app</a></span>
  <a href="/privacy/">Privacy Policy</a>
  <span>© 2026 Danylo Klyhin</span>
</footer>
</body>
</html>
